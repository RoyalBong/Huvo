# ---------------------------------------------------------------------------
# worklife-service configuration (Huvo_Backend_Context.md Sections 3.2, 6, 12).
# Mirrors identity-service and attendance-service: every environment-specific
# value is externalised as ${ENV_VAR:default}, and no host or IP is hardcoded
# outside a default.
# ---------------------------------------------------------------------------
spring.application.name=worklife-service

# Only Nginx, on the same host, needs to reach this service, so bind loopback (Section 9).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8083}

# Lean startup footprint - the backend EC2 hosts 5 JVMs (Section 8.3).
spring.main.lazy-initialization=true

# --- datasource ---
# One RDS MySQL instance, one schema per service (Section 3.4); this service owns
# huvo_worklife and never queries identity-service's or attendance-service's schema.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huvo_worklife}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# --- schema ownership ---
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- messaging ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- task rules (Section 6.2) ---
# The deadline sweep cadence. Section 6.2 says 15 minutes is sufficient, which is
# the granularity of the notification, not a correctness requirement: a task is
# late whenever it is late, the sweep only decides when anyone hears about it.
huvo.task.overdue-sweep-cron=${TASK_OVERDUE_SWEEP_CRON:0 */15 * * * *}

# How long a pre-signed upload URL stays valid (Section 6.2). Short by design -
# it is a capability to upload one object, and a long-lived one is a capability
# to upload anything for as long as it is leaked.
huvo.task.upload-url-ttl-seconds=${TASK_UPLOAD_URL_TTL_SECONDS:900}

# The S3 bucket submissions land in (Section 6.2). No default: a wrong bucket
# would silently write employee documents somewhere unexpected.
huvo.s3.submissions-bucket=${S3_SUBMISSIONS_BUCKET:}
# Region for the pre-signer, which has to match the bucket's own.
huvo.s3.region=${AWS_REGION:ap-south-1}

# --- JWT (Section 4.2) ---
# Validated in-process by huvo-security-lib; no gateway does it. No committed
# default, so a misconfigured service fails fast rather than trusting tokens
# nobody can verify.
huvo.jwt.signing-key=${JWT_SIGNING_KEY:}

# --- audit (Sections 3.4, 7) ---
# Leave approval and task assignment are guaranteed-audited: with no table
# configured those endpoints refuse the change, because an approval that cannot
# be recorded must never succeed silently.
huvo.audit.table=${AUDIT_TABLE:}

# --- observability (Section 8) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
