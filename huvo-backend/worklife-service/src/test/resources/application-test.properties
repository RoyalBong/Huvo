# Test profile: the build must never require MySQL, RabbitMQ or S3, so the Jenkins
# "unit test" stage (Section 9) can run on any agent.
#
# Note what is NOT here: no Testcontainers. Section 8.1 rules out Docker, so S3 is
# never emulated - the pre-signer is exercised only where it needs no bucket, and
# the service's own decisions (assignee check, key generation) are covered by
# their own tests.
spring.datasource.url=jdbc:h2:mem:worklife_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Flyway is off, so these tests exercise the JPA mapping, not V1__worklife_schema.sql.
# That migration is verified against real MySQL in Phase I, not here - the same
# deliberate gap every service has, applied consistently rather than per-service.
spring.flyway.enabled=false

spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Throwaway signing key so the filter chain can be built. It guards nothing and
# must never be reused outside the test profile.
huvo.jwt.signing-key=test-only-signing-key-never-used-outside-the-test-profile
