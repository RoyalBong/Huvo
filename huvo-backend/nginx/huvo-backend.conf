# Huvo backend reverse proxy - versioned in the repo and deployed by the Jenkins
# pipeline via SSM Run Command to /etc/nginx/sites-available/huvo, never hand-edited
# on the box (Huvo_Backend_Context.md Sections 3.2, 9, 11).
#
# Path-based routing replaces what a Spring Cloud Gateway used to do. There is no
# Eureka and no Config Server (Section 3.5): Nginx forwards the Authorization header
# untouched and every service validates the JWT itself via huvo-security-lib (4.2).

upstream huvo_identity   { server 127.0.0.1:8081; }   # identity-service   - auth + employee + department
upstream huvo_attendance { server 127.0.0.1:8082; }   # attendance-service - standalone (Section 3.1)
upstream huvo_worklife   { server 127.0.0.1:8083; }   # worklife-service   - task + leave + onboarding
upstream huvo_payroll    { server 127.0.0.1:8084; }   # payroll-service    - standalone (Section 3.1)
upstream huvo_notify     { server 127.0.0.1:8085; }   # notify-service     - notifications + chat

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    # --- target routing (Section 3.2) ---
    location /api/auth/        { proxy_pass http://huvo_identity; }
    location /api/employees/   { proxy_pass http://huvo_identity; }
    location /api/departments/ { proxy_pass http://huvo_identity; }
    location /api/attendance/  { proxy_pass http://huvo_attendance; }
    location /api/tasks/       { proxy_pass http://huvo_worklife; }
    location /api/leave/       { proxy_pass http://huvo_worklife; }
    location /api/documents/   { proxy_pass http://huvo_worklife; }
    location /api/payroll/     { proxy_pass http://huvo_payroll; }
    location /api/notify/      { proxy_pass http://huvo_notify; }

    # Chat is WebSocket/STOMP on notify-service - needs the upgrade headers.
    location /api/notify/ws {
        proxy_pass http://huvo_notify;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # /actuator/** is deliberately NOT routed: health is checked on the box
    # (systemd + CloudWatch), and the backend security group only accepts traffic
    # from the frontend security group (Section 8.5).
}
