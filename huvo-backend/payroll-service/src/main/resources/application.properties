# ---------------------------------------------------------------------------
# payroll-service configuration (Huo_Backend_Context.md Sections 3.2, 12).
# Mirrors the other services: every environment-specific value is externalised
# as ${ENV_VAR:default}, and no host or IP is hardcoded outside a default.
# ---------------------------------------------------------------------------
spring.application.name=payroll-service

# Section 3.2 assigns payroll-service 8084. Only Nginx, on the same host, needs
# to reach it, so bind loopback (Section 9).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8084}

# Section 8.3: lean startup footprint - five JVMs share one t4g.medium.
# Section 9.1 requires every service to carry a context-start test that overrides
# this to false, because lazy init is also what hides missing bean definitions.
spring.main.lazy-initialization=true

# --- datasource ---
# One RDS MySQL instance, one schema per service (Section 3.4). This service owns
# huvo_payroll and never queries another service's schema. Payroll data is the
# most sensitive in the system, which is exactly why Section 3.2 keeps it in its
# own schema with its own blast radius.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huvo_payroll}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# --- schema ownership ---
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- messaging ---
# Publishes payroll.generated and binds attendance.autoAbsent.triggered. Both
# exchanges are declared here rather than only the binding, so a rolling restart
# of attendance-service cannot take payroll's consumer down with it.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- payroll ---
# The currency every payslip is issued in. A single company-wide default because
# the context document specifies no multi-currency payroll and inventing a
# conversion table would be guesswork about exchange rates.
huvo.payroll.currency=${PAYROLL_CURRENCY:AED}
# S3 prefix for payslip PDFs (Section 8.1: one bucket, prefixed).
huvo.s3.payslips-prefix=${S3_PAYSLIPS_PREFIX:payslips/}
huvo.s3.region=${AWS_REGION:ap-south-1}

# --- JWT (Section 4.2) ---
# No committed default, so a misconfigured service fails fast rather than
# accepting tokens it cannot verify.
huvo.jwt.signing-key=${JWT_SIGNING_KEY:}

# --- audit (Sections 3.4, 7) ---
# Generating a payroll run is guaranteed-audited. A run that cannot be recorded
# must not proceed, because the thing it does is pay people.
huvo.audit.table=${AUDIT_TABLE:}

# --- observability (Section 8) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
