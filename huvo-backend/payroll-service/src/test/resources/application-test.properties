# Test profile: the build must run on any agent with no MySQL, RabbitMQ or AWS credentials
# (Section 9). Overrides only - application.properties is already on the classpath, and duplicating
# it here would be a second copy to drift.
#
# There is no Testcontainers and no DynamoDB Local: Section 8.1 rules out Docker, so the Flyway
# migration is not exercised here. That gap is deferred to Phase I and is the same for every service.
spring.datasource.url=jdbc:h2:mem:payroll_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Throwaway signing key so the filter chain can be built. It guards nothing and must never be reused
# outside the test profile.
huvo.jwt.signing-key=test-only-signing-key-never-used-outside-the-test-profile
