# Test profile: the build must run on any agent with no MySQL, RabbitMQ or AWS credentials
# (Section 9). Overrides only - the main application.properties is already on the classpath, and
# duplicating it here would be a second copy to drift.
#
# There is no Testcontainers and no DynamoDB Local: Section 8.1 rules out Docker, so the DynamoDB
# store is never exercised in the suite. Its stored item shape is unit tested instead - see
# DynamoNotificationStoreItemTest.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Pinned empty so the in-memory store is selected no matter what the agent's environment has
# NOTIFICATIONS_TABLE set to. Without this, a developer machine configured for the real dev table
# would have the suite try to write to AWS.
huvo.notifications.table=

# Throwaway signing key so the filter chain and the WebSocket handshake interceptor can be built.
# It guards nothing and must never be reused outside the test profile.
huvo.jwt.signing-key=test-only-signing-key-never-used-outside-the-test-profile
