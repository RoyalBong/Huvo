# ---------------------------------------------------------------------------
# notify-service configuration (Huo_Backend_Context.md Sections 3.2, 7, 12).
# Mirrors the other services: every environment-specific value is externalised
# as ${ENV_VAR:default}, and no host or IP is hardcoded outside a default.
# ---------------------------------------------------------------------------
spring.application.name=notify-service

# Only Nginx, on the same host, needs to reach this service, so bind loopback (Section 9).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8085}

# Lean startup footprint - the backend EC2 hosts 5 JVMs (Section 8.3).
spring.main.lazy-initialization=true

# No datasource. Notifications live in DynamoDB (Section 3.2): the access pattern is a
# simple write-heavy per-user feed with no joins, and MySQL would be the wrong shape.

# --- messaging ---
# Declares a queue on every other service's exchange, so this service can bind
# against a broker that has not seen any of them start yet.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- notification feed (Section 3.2) ---
# The DynamoDB table. No default on purpose: a wrong or shared table name would write one company's
# notifications into another's, and an empty value is what selects the in-memory store instead.
#   dev  : huvo-dev-notifications   (Section 8.1)
#   prod : huvo_notifications
huvo.notifications.table=${NOTIFICATIONS_TABLE:}
huvo.notifications.region=${AWS_REGION:ap-south-1}
# How many entries GET /api/notifications returns by default.
huvo.notifications.default-limit=${NOTIFICATIONS_DEFAULT_LIMIT:50}

# --- JWT (Section 4.2) ---
# Validated in-process by huvo-security-lib. No committed default, so a
# misconfigured service fails fast rather than trusting tokens nobody can verify.
huvo.jwt.signing-key=${JWT_SIGNING_KEY:}

# --- observability (Section 8) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
