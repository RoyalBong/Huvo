# ---------------------------------------------------------------------------
# identity-service configuration (auth + employee + department, Section 3.1).
# Every environment-specific value is externalised as ${ENV_VAR:default};
# the default is only meaningful for the `local` profile
# (see Huvo_Backend_Context.md §8.2). No localhost/IP is hardcoded outside
# of a default, and nothing here is environment-specific enough to break EC2.
# ---------------------------------------------------------------------------
spring.application.name=identity-service

# Only Nginx on the same host needs to reach this service, so bind loopback (Section 9).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8081}

# Lean startup footprint - the backend EC2 hosts 5 JVMs (Section 8.3).
spring.main.lazy-initialization=true

# --- datasource ---
# One RDS MySQL instance, one schema per service (Section 3.4); identity-service
# owns huvo_identity and now hosts the employee + department domains in it.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huvo_identity}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# --- schema ownership ---
# Schema is managed by Flyway migrations only, never by Hibernate (§10).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
# An existing pre-Flyway dev database is baselined at 0 and then migrated, so
# V1/V2 (written with IF NOT EXISTS) are no-ops on databases Hibernate created.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- messaging ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- JWT (§4.2, §4.3) ---
# The access/refresh signing key is NEVER given a committed default - §4.3 requires
# Parameter Store on EC2 (delivered as JWT_SIGNING_KEY in the systemd EnvironmentFile)
# and a gitignored local properties file for the `local` profile. The empty default is
# deliberate: HuvoTokenService rejects a key under 32 bytes, so a service that was
# started without its secret fails immediately instead of minting unverifiable tokens.
huvo.jwt.signing-key=${JWT_SIGNING_KEY:}

# --- audit (Sections 3.4, 7) ---
# Every employee/department mutation appends a row to the shared huvo_audit_log
# DynamoDB table through huvo-audit-client. The table name is what turns auditing
# on: leave it blank and the client is not built at all, so a build agent running
# the unit tests (Section 9) needs no AWS credentials. On EC2 the instance role
# supplies the credentials and AUDIT_TABLE names the table; no key is ever in config.
huvo.audit.table=${AUDIT_TABLE:}

# --- observability (§8) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always