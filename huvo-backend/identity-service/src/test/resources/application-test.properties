# Test profile: the build must never require a running MySQL or RabbitMQ, so the
# Jenkins "unit test" stage (§9) can run on any agent.
spring.datasource.url=jdbc:h2:mem:identity_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false

# Throwaway signing key so the filter chain can be built in tests. 48 bytes clears the
# library's 32-byte minimum, and it guards nothing - it is committed on purpose, so it
# must never be reused outside the test profile.
huvo.jwt.signing-key=test-only-signing-key-never-used-outside-the-test-profile