# ---------------------------------------------------------------------------
# attendance-service configuration (Huvo_Backend_Context.md Sections 3.2, 5).
# Mirrors identity-service's conventions: every environment-specific value is
# externalised as ${ENV_VAR:default}, and no localhost or IP is hardcoded
# outside a default.
# ---------------------------------------------------------------------------
spring.application.name=attendance-service

# Only Nginx, on the same host, needs to reach this service, so bind loopback (Section 9).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8082}

# Lean startup footprint - the backend EC2 hosts 5 JVMs (Section 8.3).
spring.main.lazy-initialization=true

# --- datasource ---
# One RDS MySQL instance, one schema per service (Section 3.4); this service owns
# huvo_attendance and never queries identity-service's schema.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huvo_attendance}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# --- schema ownership ---
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
# An existing pre-Flyway dev database is baselined at 0 and then migrated.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- messaging ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- attendance rules (§5) ---
# The zone shift start times and attendance days are expressed in. Section 5.1
# defines shifts as local wall-clock times, so this must be the company's zone -
# measuring lateness against UTC would mark east-of-UTC staff late by hours.
huvo.attendance.zone=${ATTENDANCE_ZONE:UTC}
huvo.attendance.company-id=${COMPANY_ID:1}

# --- JWT (Section 4.2) ---
# Validated in-process by huvo-security-lib; no gateway does it. No committed
# default: Parameter Store on EC2 (JWT_SIGNING_KEY in the systemd EnvironmentFile),
# a gitignored local properties file for `local`. An empty value makes the
# library reject it, so a misconfigured service fails fast rather than issuing
# tokens nobody can verify.
huvo.jwt.signing-key=${JWT_SIGNING_KEY:}

# --- audit (Sections 3.4, 7) ---
# The manual admin override (§5.2 step 8) is guaranteed-audited: with no table
# configured the override endpoint refuses the change, because an override that
# cannot be recorded must never be a silent overwrite.
huvo.audit.table=${AUDIT_TABLE:}

# --- observability (§8) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always