<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c11" />
    <meta
      name="description"
      content="Huvo — HR & Work Management Platform for growing teams."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Huvo — HR & Work Management</title>
  </head>
  <body>
    <!-- Apply the persisted theme before React boots — no flash of wrong theme. -->
    <script>
      (function () {
        try {
          var light = localStorage.getItem('huvo-theme') === 'light';
          var root = document.documentElement;
          root.classList.toggle('light', light);
          root.classList.toggle('dark', !light);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
