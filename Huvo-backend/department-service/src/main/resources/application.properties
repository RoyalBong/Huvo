# ---------------------------------------------------------------------------
# department-service configuration.
# Every environment-specific value is externalised as ${ENV_VAR:default};
# the default is only meaningful for the `local` profile
# (see Huvo Backend_Context.md §8.2).
# ---------------------------------------------------------------------------
spring.application.name=department-service

# Only Nginx on the same host needs to reach this service, so bind loopback (Section 9).
server.address=${SERVER_ADDRESS:127.0.0.1}
# Interim: 8082 belongs to attendance-service in the target port map (Section 3.2);
# this service folds into identity-service on 8081 during Phase 1, after which this
# unit and its port disappear.
server.port=${SERVER_PORT:8082}

# Lean startup footprint - the backend EC2 hosts 5 JVMs (Section 8.3).
spring.main.lazy-initialization=true

# --- datasource ---
# One RDS MySQL instance, one schema per service (Section 3.4). Employee + Department
# fold into identity-service, which owns huvo_identity (Sections 3.1, 3.2).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:huvo_identity}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false

# --- schema ownership ---
# Schema is managed by Flyway migrations only, never by Hibernate (§10).
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
# An existing pre-Flyway dev database is baselined at 0 and then migrated, so
# V1 (written with IF NOT EXISTS) is a no-op on databases Hibernate created.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# --- messaging ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# --- observability (§8) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
